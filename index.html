<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102f2c">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PocketWise · 口袋理财</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-icon">P<span>·</span></span><span>PocketWise<small>口袋理财</small></span></a>
    <div class="nav-label" data-i18n="workspace"></div>
    <nav id="navigation" aria-label="Main navigation"></nav>
    <div class="sidebar-foot"><span class="status-dot"></span><span data-i18n="privateLocal"></span></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span class="breadcrumb">PocketWise <span>/</span> <strong id="crumb"></strong></span><div class="toolbar"><button id="language-toggle" class="quiet" aria-label="Change language">中文</button><button id="theme-toggle" class="quiet"></button><span class="avatar">PW</span></div></header>
    <main id="main" tabindex="-1"></main>
    <footer data-i18n="footer"></footer>
  </div>
  <dialog id="editor"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title"></h2><button type="button" id="close-editor" class="icon-button" aria-label="Close">×</button></div><div id="editor-fields" class="form-grid"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-editor" class="button secondary" data-i18n="cancel"></button><button type="submit" class="button" data-i18n="save"></button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>PocketWise requires JavaScript. / 口袋理财需要启用 JavaScript。</noscript>
</body>
</html>
